global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      scheme: http
      timeout: 10s
      api_version: v2
scrape_configs:
  - job_name: "otel-col"
    static_configs:
      - targets: ["otelcol:8889"]
  - job_name: "couchbase-otel-col"
    metrics_path: /metrics
    static_configs:
      - targets: [ "couchbase:8091" ]
    basic_auth:
      username: "admin"
      password: "password"
    scheme: http
#    scrape_timeout: 5s
    fallback_scrape_protocol: PrometheusText1.0.0